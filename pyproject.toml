[project]
name = "flask-learning"
version = "0.1.0"
description = "This project focuses on growth of knowledge using flask, uv, and python API requests"
readme = "README.md"
authors = [
    { name = "THE BLUE STORY", email = "blustory.g@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "flask",
    "ipykernel>=7.4.0",
]

[project.scripts]
flask-learning = "flask_learning:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"
